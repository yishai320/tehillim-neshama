<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fruit Ninja</title>
<meta name="description" content="A fast, offline-ready Fruit Ninja arcade game — swipe to slice fruit, dodge the bombs, chase combos.">
<meta name="theme-color" content="#4a2e16">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fruit Ninja">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #14100c;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * (800 / 600)));
    height: min(100vh, calc(100vw * (600 / 800)));
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,0,0,.8);
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background: rgba(10, 6, 3, 0.72);
    backdrop-filter: blur(2px);
    border-radius: 6px;
    opacity: 1;
    transition: opacity .45s ease;
    z-index: 5;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(40px, 9vmin, 78px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffd23e;
    text-shadow: 0 4px 0 #a63c06, 0 8px 24px rgba(0,0,0,.9);
    margin-bottom: 8px;
  }
  .title .red { color: #ff4b3a; }
  .subtitle {
    color: #e8dcc8;
    font-size: clamp(14px, 2.6vmin, 20px);
    max-width: 560px;
    line-height: 1.55;
    margin: 10px 24px 26px;
    text-shadow: 0 2px 4px #000;
  }
  .subtitle b { color: #ffd23e; }
  .subtitle .bomb { color: #ff6b5e; }
  .btn {
    font-family: inherit;
    font-size: clamp(18px, 3.4vmin, 26px);
    font-weight: 800;
    letter-spacing: 1px;
    color: #3a1c02;
    background: linear-gradient(180deg, #ffe08a 0%, #ffb52e 55%, #f08a00 100%);
    border: 3px solid #7c4a08;
    border-radius: 999px;
    padding: 14px 52px;
    cursor: pointer;
    box-shadow: 0 6px 0 #7c4a08, 0 12px 24px rgba(0,0,0,.6);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #7c4a08, 0 16px 28px rgba(0,0,0,.6); }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #7c4a08, 0 6px 12px rgba(0,0,0,.6); }
  .finalScore {
    color: #fff;
    font-size: clamp(22px, 4.6vmin, 34px);
    font-weight: 800;
    margin-bottom: 6px;
    text-shadow: 0 3px 8px #000;
  }
  .bestScore {
    color: #9fd0ff;
    font-size: clamp(14px, 2.8vmin, 20px);
    margin-bottom: 28px;
    text-shadow: 0 2px 4px #000;
  }
  #gameOverTitle.bombed { color: #ff4b3a; text-shadow: 0 4px 0 #5e0d05, 0 8px 24px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="800" height="600"></canvas>

    <div id="startScreen" class="overlay">
      <div class="title">FRUIT <span class="red">NINJA</span></div>
      <div class="subtitle">
        Swipe with your <b>mouse</b> or <b>finger</b> to slice fruit.<br>
        Slice <b>3+</b> fruits in one swipe for a <b>COMBO</b> bonus.<br>
        Don't slice the <span class="bomb">bombs</span> &mdash; and don't drop the fruit.
        Three misses and it's over!
      </div>
      <button id="startBtn" class="btn">START</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div id="gameOverTitle" class="title">GAME OVER</div>
      <div id="finalScore" class="finalScore">Score: 0</div>
      <div id="bestScore" class="bestScore">Best: 0</div>
      <button id="restartBtn" class="btn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
'use strict';
(() => {

  // ============================== Constants ==============================
  const W = 800, H = 600;
  const GRAVITY = 0.22;            // px per frame^2 (60fps frame units)
  const TRAIL_LIFE = 220;          // ms a blade point lives
  const TRAIL_MAX = 40;            // max stored blade points
  const COMBO_GAP = 350;           // ms between slices to keep a swipe-chain alive
  const BOMB_CHANCE = 0.15;
  const MAX_LIVES = 3;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const gameOverTitle = document.getElementById('gameOverTitle');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const TAU = Math.PI * 2;

  // ============================== Fruit types ============================
  const FRUIT_TYPES = {
    watermelon: { radius: 46, points: 20, weight: 0.15,
      rind: '#1e7a2e', rindDark: '#145c1f', flesh: '#ff4f5e', fleshLight: '#ff8a94',
      juice: '#ff3b4d' },
    apple: { radius: 28, points: 10, weight: 0.25,
      rind: '#d92b2b', rindDark: '#8f1414', flesh: '#f7ecc8', fleshLight: '#fff8e2',
      juice: '#e8d98a' },
    orange: { radius: 31, points: 10, weight: 0.25,
      rind: '#ff9518', rindDark: '#c96a05', flesh: '#ffb84d', fleshLight: '#ffd88f',
      juice: '#ffa321' },
    banana: { radius: 34, points: 15, weight: 0.20,
      rind: '#ffd93d', rindDark: '#cfa312', flesh: '#fdf3c8', fleshLight: '#fffbe8',
      juice: '#f5e27a' },
    coconut: { radius: 35, points: 25, weight: 0.15,
      rind: '#6b4a2b', rindDark: '#4a2f16', flesh: '#fdfdf5', fleshLight: '#ffffff',
      juice: '#f2efe2' }
  };
  const FRUIT_KEYS = Object.keys(FRUIT_TYPES);

  function pickFruitType() {
    let r = Math.random(), acc = 0;
    for (const key of FRUIT_KEYS) {
      acc += FRUIT_TYPES[key].weight;
      if (r <= acc) return key;
    }
    return 'apple';
  }

  // ============================== Game state =============================
  const game = {
    state: 'menu',           // 'menu' | 'playing' | 'gameover'
    ending: false,           // bomb hit / last life lost, playing out the end
    endTimer: 0,
    endedByBomb: false,
    score: 0,
    best: 0,
    lives: MAX_LIVES,
    fruits: [],              // whole fruits + bombs
    halves: [],
    particles: [],
    texts: [],
    trail: [],
    spawnTimer: 1000,
    elapsed: 0,              // ms since round start
    chain: { count: 0, lastT: -1e9, sumX: 0, sumY: 0 },
    flash: 0,
    shake: 0,
    lifeFlash: [0, 0, 0],
    pointerDown: false
  };

  try { game.best = parseInt(localStorage.getItem('fn_best') || '0', 10) || 0; } catch (e) {}

  // ============================== Audio (synth) ==========================
  const SFX = {
    ac: null,
    init() {
      if (this.ac) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ac = new AC();
      } catch (e) { this.ac = null; }
    },
    noiseBuffer() {
      const ac = this.ac;
      const buf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    },
    slice() {
      const ac = this.ac;
      if (!ac || ac.state !== 'running') return;
      const src = ac.createBufferSource();
      src.buffer = this.noiseBuffer();
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1800, ac.currentTime);
      bp.frequency.exponentialRampToValueAtTime(500, ac.currentTime + 0.14);
      bp.Q.value = 1.2;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.28, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.16);
      src.connect(bp).connect(g).connect(ac.destination);
      src.start();
      src.stop(ac.currentTime + 0.18);
    },
    boom() {
      const ac = this.ac;
      if (!ac || ac.state !== 'running') return;
      const o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(160, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.6);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.7, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.7);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + 0.75);
      const src = ac.createBufferSource();
      src.buffer = this.noiseBuffer();
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 900;
      const g2 = ac.createGain();
      g2.gain.setValueAtTime(0.5, ac.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
      src.connect(lp).connect(g2).connect(ac.destination);
      src.start();
      src.stop(ac.currentTime + 0.55);
    },
    miss() {
      const ac = this.ac;
      if (!ac || ac.state !== 'running') return;
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(320, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.3);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.18, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.32);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + 0.35);
    }
  };

  // ============================== Background =============================
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  (function paintBackground() {
    const b = bg.getContext('2d');
    const base = b.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, '#6b4423');
    base.addColorStop(0.5, '#5a3a1e');
    base.addColorStop(1, '#4a2e16');
    b.fillStyle = base;
    b.fillRect(0, 0, W, H);

    const plankW = 100;
    for (let p = 0; p < W / plankW; p++) {
      const x = p * plankW;
      const tone = (p % 2 === 0) ? 'rgba(0,0,0,0.07)' : 'rgba(255,220,160,0.045)';
      b.fillStyle = tone;
      b.fillRect(x, 0, plankW, H);
      b.strokeStyle = 'rgba(20,10,4,0.55)';
      b.lineWidth = 2.5;
      b.beginPath();
      b.moveTo(x, 0);
      b.lineTo(x, H);
      b.stroke();

      // grain lines per plank
      for (let i = 0; i < 22; i++) {
        const gy = (i / 22) * H + (p * 37 % 19);
        const amp = 3 + ((p * 13 + i * 7) % 9);
        b.strokeStyle = 'rgba(30,16,6,' + (0.10 + ((i * 5 + p * 3) % 10) / 60) + ')';
        b.lineWidth = 1 + ((i + p) % 3) * 0.5;
        b.beginPath();
        b.moveTo(x + 4, gy);
        b.bezierCurveTo(x + plankW * 0.3, gy + amp, x + plankW * 0.7, gy - amp, x + plankW - 4, gy + amp * 0.4);
        b.stroke();
      }
      // a knot on some planks
      if (p % 3 === 1) {
        const kx = x + plankW / 2 + (p * 29 % 24) - 12;
        const ky = (p * 131 % H);
        for (let r = 10; r > 1; r -= 2.4) {
          b.strokeStyle = 'rgba(25,12,4,0.35)';
          b.lineWidth = 1.4;
          b.beginPath();
          b.ellipse(kx, ky, r, r * 0.62, 0.3, 0, TAU);
          b.stroke();
        }
      }
    }
    // vignette
    const v = b.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.5)');
    b.fillStyle = v;
    b.fillRect(0, 0, W, H);
  })();

  // ============================== Entities ===============================
  function spawnWave() {
    const diff = Math.min(1, game.score / 250);
    const maxN = game.score < 40 ? 2 : (game.score < 120 ? 3 : 4);
    const n = randInt(1, maxN);
    for (let i = 0; i < n; i++) {
      const x = rand(90, W - 90);
      const isBomb = game.elapsed > 3500 && Math.random() < BOMB_CHANCE;
      const type = isBomb ? 'bomb' : pickFruitType();
      const radius = isBomb ? 26 : FRUIT_TYPES[type].radius;
      game.fruits.push({
        kind: isBomb ? 'bomb' : 'fruit',
        type,
        x,
        y: H + radius + rand(10, 60),
        vx: ((W / 2 - x) / (W / 2)) * rand(0.9, 2.5) + rand(-0.7, 0.7),
        vy: -rand(14.4 + diff * 0.8, 17.1 + diff * 0.8),
        rot: rand(0, TAU),
        spin: rand(-0.06, 0.06),
        radius,
        sliced: false,
        missed: false
      });
    }
    const interval = Math.max(680, 1750 - game.score * 3.5);
    game.spawnTimer = interval * rand(0.85, 1.2);
  }

  function sliceFruit(f, angle) {
    f.sliced = true;
    const cfg = FRUIT_TYPES[f.type];
    const nx = -Math.sin(angle), ny = Math.cos(angle);   // perpendicular to blade

    for (const side of [1, -1]) {
      game.halves.push({
        type: f.type,
        x: f.x, y: f.y,
        vx: f.vx + nx * 2 * side,
        vy: f.vy + ny * 2 * side,
        rot: f.rot,
        spin: f.spin + side * rand(0.05, 0.13),
        radius: f.radius,
        sliceAngle: angle - f.rot,   // stored in fruit-local space
        side
      });
    }

    const count = randInt(10, 15);
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU), sp = rand(1, 5.2);
      game.particles.push({
        x: f.x + Math.cos(a) * f.radius * 0.4,
        y: f.y + Math.sin(a) * f.radius * 0.4,
        vx: Math.cos(a) * sp + f.vx * 0.4,
        vy: Math.sin(a) * sp + f.vy * 0.3,
        r: rand(2.5, 6.5),
        alpha: 1,
        decay: rand(0.018, 0.034),
        color: Math.random() < 0.65 ? cfg.juice : cfg.flesh
      });
    }

    game.score += cfg.points;
    addText(f.x, f.y - f.radius * 0.6, '+' + cfg.points, '#ffe27a', 22);

    // swipe combo chain
    const now = performance.now();
    if (now - game.chain.lastT > COMBO_GAP) finalizeChain();
    game.chain.count++;
    game.chain.lastT = now;
    game.chain.sumX += f.x;
    game.chain.sumY += f.y;

    SFX.slice();
  }

  function finalizeChain() {
    const c = game.chain;
    if (c.count >= 3) {
      const bonus = c.count * 10;
      game.score += bonus;
      addText(c.sumX / c.count, c.sumY / c.count - 30,
        'COMBO x' + c.count + '  +' + bonus, '#7dff8a', 30);
    }
    c.count = 0; c.sumX = 0; c.sumY = 0;
  }

  function hitBomb(f) {
    f.sliced = true;
    game.ending = true;
    game.endedByBomb = true;
    game.endTimer = 1300;
    game.flash = 1.5;
    game.shake = 26;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), sp = rand(2, 9);
      game.particles.push({
        x: f.x, y: f.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        r: rand(3, 9),
        alpha: 1,
        decay: rand(0.015, 0.03),
        color: ['#ffb02e', '#ff5e2e', '#8a8a8a', '#fff2c0'][randInt(0, 3)]
      });
    }
    SFX.boom();
  }

  function loseLife(f) {
    if (game.ending) return;
    game.lives--;
    const idx = MAX_LIVES - 1 - game.lives;
    if (idx >= 0 && idx < MAX_LIVES) game.lifeFlash[idx] = 1;
    addText(f.x, H - 46, 'MISS', '#ff6b5e', 26);
    SFX.miss();
    if (game.lives <= 0) {
      game.ending = true;
      game.endedByBomb = false;
      game.endTimer = 900;
    }
  }

  function addText(x, y, text, color, size) {
    game.texts.push({ x, y, text, color, size, alpha: 1, vy: -0.8, life: 1 });
  }

  // ============================== Input ==================================
  function canvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    SFX.init();
    if (SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume();
    game.pointerDown = true;
    game.trail.length = 0;
    const p = canvasPos(e);
    game.trail.push({ x: p.x, y: p.y, t: performance.now() });
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    if (!game.pointerDown) return;
    const p = canvasPos(e);
    const now = performance.now();
    const prev = game.trail[game.trail.length - 1];
    game.trail.push({ x: p.x, y: p.y, t: now });
    if (game.trail.length > TRAIL_MAX) game.trail.shift();

    if (game.state !== 'playing' || game.ending || !prev) return;
    const dx = p.x - prev.x, dy = p.y - prev.y;
    if (dx * dx + dy * dy < 9) return;   // too slow to cut
    const angle = Math.atan2(dy, dx);

    for (const f of game.fruits) {
      if (f.sliced) continue;
      if (segCircleHit(prev.x, prev.y, p.x, p.y, f.x, f.y, f.radius)) {
        if (f.kind === 'bomb') { hitBomb(f); break; }
        sliceFruit(f, angle);
      }
    }
    game.fruits = game.fruits.filter(f => !f.sliced);
  });

  function endPointer() {
    game.pointerDown = false;
    finalizeChain();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  function segCircleHit(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = x1 + t * dx - cx, py = y1 + t * dy - cy;
    return px * px + py * py <= r * r;
  }

  // ============================== Update =================================
  function update(dt, now) {
    // fade blade trail
    while (game.trail.length && now - game.trail[0].t > TRAIL_LIFE) game.trail.shift();

    // decay effects
    game.flash = Math.max(0, game.flash - 0.02 * dt);
    game.shake = Math.max(0, game.shake - 0.9 * dt);
    for (let i = 0; i < MAX_LIVES; i++) {
      game.lifeFlash[i] = Math.max(0, game.lifeFlash[i] - 0.03 * dt);
    }

    // particles & texts always animate (menus included, for juice)
    for (const p of game.particles) {
      p.vy += GRAVITY * 0.6 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.alpha -= p.decay * dt;
    }
    game.particles = game.particles.filter(p => p.alpha > 0);

    for (const t of game.texts) {
      t.y += t.vy * dt;
      t.alpha -= 0.016 * dt;
    }
    game.texts = game.texts.filter(t => t.alpha > 0);

    if (game.state !== 'playing') return;

    game.elapsed += dt * 16.667;

    // combo chain timeout (swipe kept moving but stopped hitting fruit)
    if (game.chain.count > 0 && now - game.chain.lastT > COMBO_GAP) finalizeChain();

    // spawner
    if (!game.ending) {
      game.spawnTimer -= dt * 16.667;
      if (game.spawnTimer <= 0) spawnWave();
    }

    // whole fruits & bombs
    for (const f of game.fruits) {
      f.vy += GRAVITY * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.spin * dt;
      if (!f.missed && f.vy > 0 && f.y - f.radius > H + 30) {
        f.missed = true;
        if (f.kind === 'fruit' && !game.ending) loseLife(f);
      }
    }
    game.fruits = game.fruits.filter(f => !f.missed);

    // halves
    for (const h of game.halves) {
      h.vy += GRAVITY * dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.rot += h.spin * dt;
    }
    game.halves = game.halves.filter(h => h.y - h.radius < H + 80);

    // end-of-round playout
    if (game.ending) {
      game.endTimer -= dt * 16.667;
      if (game.endTimer <= 0) gameOver();
    }
  }

  // ============================== Drawing: fruits ========================
  function drawFruit(f, now) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    if (f.kind === 'bomb') drawBomb(f, now);
    else DRAW[f.type](f.radius);
    ctx.restore();
  }

  const DRAW = {
    watermelon(r) {
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.15, 0, 0, r);
      g.addColorStop(0, '#37b24d');
      g.addColorStop(1, '#1c6b2a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();
      // dark stripes, clipped to the circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.clip();
      ctx.strokeStyle = '#145c1f';
      ctx.lineWidth = r * 0.16;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * r * 0.42, -r);
        ctx.quadraticCurveTo(i * r * 0.42 + r * 0.22, 0, i * r * 0.42, r);
        ctx.stroke();
      }
      ctx.restore();
      shine(r);
    },
    apple(r) {
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#ff6b5e');
      g.addColorStop(0.6, '#d92b2b');
      g.addColorStop(1, '#9c1414');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();
      // stem
      ctx.strokeStyle = '#5e3a17';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.85);
      ctx.quadraticCurveTo(r * 0.12, -r * 1.22, r * 0.3, -r * 1.3);
      ctx.stroke();
      // leaf
      ctx.fillStyle = '#3f9b34';
      ctx.beginPath();
      ctx.ellipse(r * 0.42, -r * 1.06, r * 0.3, r * 0.14, -0.5, 0, TAU);
      ctx.fill();
      shine(r);
    },
    orange(r) {
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#ffbf57');
      g.addColorStop(0.65, '#ff9518');
      g.addColorStop(1, '#d97706');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();
      // peel dimples
      ctx.fillStyle = 'rgba(180,100,10,0.5)';
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * TAU + 0.4;
        const rr = r * (0.35 + (i % 4) * 0.14);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.4, 0, TAU);
        ctx.fill();
      }
      // stem dot + leaf
      ctx.fillStyle = '#7a4b12';
      ctx.beginPath();
      ctx.arc(0, -r * 0.92, 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#3f9b34';
      ctx.beginPath();
      ctx.ellipse(r * 0.26, -r * 0.98, r * 0.26, r * 0.11, -0.4, 0, TAU);
      ctx.fill();
      shine(r);
    },
    banana(r) {
      const s = r / 34;
      ctx.save();
      ctx.scale(s, s);
      const g = ctx.createLinearGradient(0, -34, 0, 32);
      g.addColorStop(0, '#ffe06e');
      g.addColorStop(0.6, '#ffd93d');
      g.addColorStop(1, '#e3b81f');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, -10, 42, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.arc(0, -34, 46, 0.82 * Math.PI, 0.18 * Math.PI, true);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#b8941a';
      ctx.lineWidth = 2;
      ctx.stroke();
      // brown tips
      ctx.fillStyle = '#6b4a1b';
      ctx.beginPath();
      ctx.arc(40, 2, 4.5, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-40, 2, 4.5, 0, TAU);
      ctx.fill();
      // ridge line
      ctx.strokeStyle = 'rgba(184,148,26,0.7)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, -20, 42, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
      ctx.restore();
    },
    coconut(r) {
      const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
      g.addColorStop(0, '#8a6238');
      g.addColorStop(0.7, '#6b4a2b');
      g.addColorStop(1, '#452b13');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();
      // fibrous texture
      ctx.strokeStyle = 'rgba(52,32,12,0.55)';
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3);
        ctx.lineTo(Math.cos(a + 0.35) * r * 0.92, Math.sin(a + 0.35) * r * 0.92);
        ctx.stroke();
      }
      // three eyes
      ctx.fillStyle = '#2e1b08';
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + (i - 1) * 0.55;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.34, Math.sin(a) * r * 0.34 - r * 0.12, r * 0.09, 0, TAU);
        ctx.fill();
      }
      shine(r);
    }
  };

  function shine(r) {
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.38, -r * 0.42, r * 0.26, r * 0.14, -0.7, 0, TAU);
    ctx.fill();
  }

  function drawBomb(f, now) {
    const r = f.radius;
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#5c5c66');
    g.addColorStop(0.55, '#26262e');
    g.addColorStop(1, '#0c0c10');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.4, r * 0.22, r * 0.12, -0.7, 0, TAU);
    ctx.fill();
    // cap
    ctx.fillStyle = '#3a3a44';
    ctx.fillRect(-r * 0.22, -r - r * 0.28, r * 0.44, r * 0.32);
    // fuse
    ctx.strokeStyle = '#c9a86a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r - r * 0.24);
    ctx.quadraticCurveTo(r * 0.36, -r - r * 0.62, r * 0.6, -r - r * 0.42);
    ctx.stroke();
    // flickering spark
    const sx = r * 0.6, sy = -r - r * 0.42;
    const flick = 0.7 + 0.3 * Math.sin(now * 0.045 + f.x);
    ctx.fillStyle = 'rgba(255,190,60,' + (0.35 * flick) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, 9 * flick, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = now * 0.02 + (i / 5) * TAU;
      const rr = (i % 2 ? 2.4 : 5.4) * flick;
      ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    // skull-white glint ring
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.82, 0, TAU);
    ctx.stroke();
  }

  function drawHalf(h) {
    const cfg = FRUIT_TYPES[h.type];
    const r = h.radius;
    const a0 = h.side === 1 ? h.sliceAngle : h.sliceAngle + Math.PI;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);

    // flesh half-disc
    const g = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
    g.addColorStop(0, cfg.fleshLight);
    g.addColorStop(1, cfg.flesh);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, a0, a0 + Math.PI);
    ctx.closePath();
    ctx.fill();

    // rind arc
    ctx.strokeStyle = cfg.rind;
    ctx.lineWidth = r * 0.18;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, a0, a0 + Math.PI);
    ctx.stroke();
    ctx.strokeStyle = cfg.rindDark;
    ctx.lineWidth = r * 0.06;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.0, a0, a0 + Math.PI);
    ctx.stroke();

    // flat cut edge highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0) * r * 0.9, Math.sin(a0) * r * 0.9);
    ctx.lineTo(Math.cos(a0 + Math.PI) * r * 0.9, Math.sin(a0 + Math.PI) * r * 0.9);
    ctx.stroke();

    // per-fruit interior detail
    const mid = a0 + Math.PI / 2;   // direction into the half
    if (h.type === 'watermelon') {
      ctx.fillStyle = '#231205';
      for (let i = -2; i <= 2; i++) {
        const along = i * r * 0.28;
        const px = Math.cos(a0) * along + Math.cos(mid) * r * 0.3;
        const py = Math.sin(a0) * along + Math.sin(mid) * r * 0.3;
        ctx.beginPath();
        ctx.ellipse(px, py, r * 0.045, r * 0.075, mid, 0, TAU);
        ctx.fill();
      }
    } else if (h.type === 'orange') {
      ctx.strokeStyle = 'rgba(230,130,20,0.8)';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 4; i++) {
        const a = a0 + (Math.PI / 8) + i * (Math.PI / 5);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82);
        ctx.stroke();
      }
    } else if (h.type === 'apple') {
      ctx.fillStyle = '#4a2c10';
      for (const s of [-0.16, 0.16]) {
        ctx.beginPath();
        ctx.ellipse(Math.cos(a0) * r * s + Math.cos(mid) * r * 0.18,
                    Math.sin(a0) * r * s + Math.sin(mid) * r * 0.18,
                    r * 0.05, r * 0.09, mid, 0, TAU);
        ctx.fill();
      }
    } else if (h.type === 'coconut') {
      ctx.strokeStyle = 'rgba(180,170,150,0.6)';
      ctx.lineWidth = r * 0.08;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.55, a0, a0 + Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ============================== Drawing: HUD & FX ======================
  function drawTrail(now) {
    const pts = game.trail;
    if (pts.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // glow pass then core pass
    for (const pass of [
      { color: 'rgba(120,200,255,0.35)', width: 16 },
      { color: 'rgba(255,255,255,0.9)', width: 6 }
    ]) {
      for (let i = 1; i < pts.length; i++) {
        const age = 1 - (now - pts[i].t) / TRAIL_LIFE;
        if (age <= 0) continue;
        ctx.strokeStyle = pass.color;
        ctx.globalAlpha = age;
        ctx.lineWidth = pass.width * age;
        ctx.beginPath();
        ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
        ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawHUD() {
    // Score (top-left) with a tiny watermelon icon
    ctx.save();
    ctx.translate(30, 34);
    ctx.fillStyle = '#37b24d';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ff4f5e';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#231205';
    ctx.beginPath();
    ctx.arc(-3, -2, 1.6, 0, TAU);
    ctx.arc(4, 2, 1.6, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.font = '900 40px "Trebuchet MS", Verdana, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#ffe27a';
    ctx.fillText(String(game.score), 56, 36);
    ctx.shadowColor = 'transparent';
    ctx.font = '700 13px "Trebuchet MS", Verdana, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('BEST ' + game.best, 58, 66);
    ctx.restore();

    // Lives: three X slots (top-right); lost = bright red
    for (let i = 0; i < MAX_LIVES; i++) {
      const lost = i < MAX_LIVES - game.lives;
      const x = W - 34 - (MAX_LIVES - 1 - i) * 46;
      const y = 36;
      const flash = game.lifeFlash[i];
      const s = 12 + flash * 8;
      ctx.save();
      ctx.translate(x, y);
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;
      ctx.strokeStyle = lost ? '#ff2e1f' : 'rgba(255,255,255,0.34)';
      ctx.lineWidth = lost ? 9 : 7;
      ctx.beginPath();
      ctx.moveTo(-s, -s); ctx.lineTo(s, s);
      ctx.moveTo(s, -s); ctx.lineTo(-s, s);
      ctx.stroke();
      if (lost) {
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#ffd0c9';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-s, -s); ctx.lineTo(s, s);
        ctx.moveTo(s, -s); ctx.lineTo(-s, s);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function render(now) {
    ctx.save();
    if (game.shake > 0.4) {
      ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
    }
    ctx.drawImage(bg, 0, 0);

    for (const h of game.halves) drawHalf(h);
    for (const f of game.fruits) drawFruit(f, now);

    for (const p of game.particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const t of game.texts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, t.alpha));
      ctx.font = '900 ' + t.size + 'px "Trebuchet MS", Verdana, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    }

    drawTrail(now);
    if (game.state === 'playing') drawHUD();
    ctx.restore();

    // bomb white-out flash (drawn unshaken, full screen)
    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, game.flash) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ============================== Loop ===================================
  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 16.667, 2.5);   // 60fps frame units
    lastTime = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ============================== State transitions ======================
  function startGame() {
    game.state = 'playing';
    game.ending = false;
    game.endedByBomb = false;
    game.score = 0;
    game.lives = MAX_LIVES;
    game.fruits.length = 0;
    game.halves.length = 0;
    game.particles.length = 0;
    game.texts.length = 0;
    game.trail.length = 0;
    game.spawnTimer = 700;
    game.elapsed = 0;
    game.flash = 0;
    game.shake = 0;
    game.lifeFlash = [0, 0, 0];
    game.chain = { count: 0, lastT: -1e9, sumX: 0, sumY: 0 };
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    SFX.init();
    if (SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume();
  }

  function gameOver() {
    game.state = 'gameover';
    game.ending = false;
    finalizeChain();
    if (game.score > game.best) {
      game.best = game.score;
      try { localStorage.setItem('fn_best', String(game.best)); } catch (e) {}
    }
    gameOverTitle.textContent = game.endedByBomb ? 'BOOM!' : 'GAME OVER';
    gameOverTitle.classList.toggle('bombed', game.endedByBomb);
    finalScoreEl.textContent = 'Score: ' + game.score;
    bestScoreEl.textContent = 'Best: ' + game.best;
    gameOverScreen.classList.remove('hidden');
  }

})();

// PWA: register the service worker (skipped when opened as a local file)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
